name: WakeWay Android Build

on:
  workflow_dispatch:
  push:
    branches: [ main ]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle

      - name: Configure Android runtime settings
        env:
          WAKEWAY_BACKEND_URL: ${{ secrets.WAKEWAY_BACKEND_URL }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_PUBLISHABLE_KEY: ${{ secrets.SUPABASE_PUBLISHABLE_KEY }}
        shell: bash
        run: |
          printf 'WAKEWAY_BACKEND_URL=%s\n' "$WAKEWAY_BACKEND_URL" > local.properties
          printf 'SUPABASE_URL=%s\n' "$SUPABASE_URL" >> local.properties
          printf 'SUPABASE_PUBLISHABLE_KEY=%s\n' "$SUPABASE_PUBLISHABLE_KEY" >> local.properties

      - name: Install Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.4.1"

      - name: Build debug APK
        run: gradle --no-daemon assembleDebug

      - name: Build release AAB
        run: gradle --no-daemon bundleRelease

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: wakeway-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      - name: Upload release AAB
        uses: actions/upload-artifact@v4
        with:
          name: wakeway-release-aab
          path: app/build/outputs/bundle/release/*.aab
          if-no-files-found: error
