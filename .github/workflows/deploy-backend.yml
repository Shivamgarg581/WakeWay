name: Deploy WakeWay Backend

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - "backend/**"
      - ".github/workflows/deploy-backend.yml"

concurrency:
  group: wakeway-backend-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Skip when Cloudflare credentials are not configured
        if: env.CLOUDFLARE_API_TOKEN == '' || env.CLOUDFLARE_ACCOUNT_ID == ''
        run: echo "Backend deployment skipped — add CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID to GitHub repository secrets."

      - name: Setup Node
        if: env.CLOUDFLARE_API_TOKEN != '' && env.CLOUDFLARE_ACCOUNT_ID != ''
        uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: backend/package.json

      - name: Install dependencies
        if: env.CLOUDFLARE_API_TOKEN != '' && env.CLOUDFLARE_ACCOUNT_ID != ''
        run: npm install

      - name: Prepare Worker secrets file
        if: env.CLOUDFLARE_API_TOKEN != '' && env.CLOUDFLARE_ACCOUNT_ID != ''
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_PUBLISHABLE_KEY: ${{ secrets.SUPABASE_PUBLISHABLE_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: ${{ secrets.GEMINI_MODEL }}
          RAILRADAR_API_KEY: ${{ secrets.RAILRADAR_API_KEY }}
        shell: bash
        run: |
          python3 - <<'PY'
          import json
          import os
          names = [
              "SUPABASE_URL",
              "SUPABASE_PUBLISHABLE_KEY",
              "SUPABASE_SERVICE_ROLE_KEY",
              "GEMINI_API_KEY",
              "GEMINI_MODEL",
              "RAILRADAR_API_KEY",
          ]
          values = {name: os.environ.get(name, "") for name in names if os.environ.get(name, "")}
          with open(".wakeway-secrets.json", "w", encoding="utf-8") as f:
              json.dump(values, f)
          PY
          chmod 600 .wakeway-secrets.json

      - name: Deploy Worker with secrets
        if: env.CLOUDFLARE_API_TOKEN != '' && env.CLOUDFLARE_ACCOUNT_ID != ''
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: backend
          command: deploy --secrets-file .wakeway-secrets.json

      - name: Smoke test deployed Worker
        if: env.CLOUDFLARE_API_TOKEN != '' && env.CLOUDFLARE_ACCOUNT_ID != ''
        shell: bash
        run: |
          set -e
          echo "Waiting for Workers deployment propagation…"
          sleep 12
          curl --fail --silent --show-error --retry 8 --retry-delay 3 "https://wakeway-api.shivgarg184.workers.dev/health"
          echo
          curl --fail --silent --show-error --retry 8 --retry-delay 3 "https://wakeway-api.shivgarg184.workers.dev/api/config"
          echo

      - name: Remove temporary secrets file
        if: always()
        working-directory: backend
        run: rm -f .wakeway-secrets.json

      - name: Done
        if: env.CLOUDFLARE_API_TOKEN != '' && env.CLOUDFLARE_ACCOUNT_ID != ''
        run: echo "WakeWay backend deployment completed."
