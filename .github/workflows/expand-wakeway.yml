name: Expand WakeWay ZIP

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  expand:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Expand project
        shell: bash
        run: |
          set -e
          test -f WakeWay-Mobile-Ready.zip
          rm -f app
          rm -f build.gradle.kts
          rm -f proguard-rules.pro
          rm -rf .wakeway_unpack
          mkdir .wakeway_unpack
          unzip -q WakeWay-Mobile-Ready.zip -d .wakeway_unpack
          cp -a .wakeway_unpack/. .
          rm -rf .wakeway_unpack
          rm -f WakeWay-Mobile-Ready.zip
          rm -f proguard-rules.pro
          rm -f .github/workflows/expand-wakeway.yml

      - name: Commit expanded project
        shell: bash
        run: |
          set -e
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi
          git commit -m "Expand WakeWay project structure"
          git push
