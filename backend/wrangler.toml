name = "wakeway-api"
main = "src/index.js"
compatibility_date = "2026-09-17"

[vars]
APP_ENV = "production"

# Backend credentials are injected by GitHub Actions from repository secrets.
# Configure these through `wrangler secret put`, not in this file:
# SUPABASE_URL
# SUPABASE_PUBLISHABLE_KEY
# SUPABASE_SERVICE_ROLE_KEY
# GEMINI_API_KEY
# RAILRADAR_API_KEY
